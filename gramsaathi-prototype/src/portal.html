<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Citizen Services Sandbox</title></head><body class="portal-page"><div class="portal-bar">◉ PRACTICE PORTAL / अभ्यास पोर्टल</div><div class="portal-body"><h2 id="portalTitle">Citizen Services</h2><p class="hint" id="portalStatus">Waiting for a case connection.</p><form id="authForm" hidden><label>Demo login code / नमूना कोड<input id="code" required inputmode="numeric" placeholder="246810" autocomplete="off"></label><p class="hint">Practice code: 246810 / अभ्यास कोड: 246810</p><button class="primary">Log in / लॉगिन करें</button></form><form id="applicationForm" hidden><div class="fields"><label>Full name<input name="name" required></label><label>Mobile<input name="phone" required pattern="[6-9][0-9]{9}"></label><label>State<input name="state" required></label><label>District<input name="district" required></label><label class="full">Address<textarea name="address" required minlength="10"></textarea></label><label>PIN<input name="pin" required pattern="[1-9][0-9]{5}"></label><label id="incomeField">Annual income (₹)<input name="income" type="number" min="0"></label><label id="landField">Land area (hectares)<input name="land" type="number" min="0.01" step="0.01"></label><label class="full">Document reference<input name="documentId" required readonly></label></div><p class="hint">You can correct any detail here. Review the final summary before sending. / जानकारी सुधार सकते हैं। भेजने से पहले सारांश जांचें।</p></form><p id="portalError" class="error" role="alert"></p></div><script src="/portal.js"></script></body></html>
